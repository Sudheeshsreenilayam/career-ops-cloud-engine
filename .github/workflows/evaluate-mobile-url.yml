name: Evaluate Mobile Job URL

on:
  repository_dispatch:
    types: [evaluate-url]
  workflow_dispatch:
    inputs:
      job_url:
        description: "Job Posting URL to evaluate"
        required: true
        type: string

permissions:
  contents: write

jobs:
  evaluate-single:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Cloud Engine Repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Install Dependencies
      run: npm ci

    - name: Run Single Job Evaluation
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ANONYMIZED_PROFILE: ${{ secrets.ANONYMIZED_PROFILE }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        JOB_URL: ${{ github.event.inputs.job_url || github.event.client_payload.url }}
      run: |
        echo "Processing single URL..."
        node eval-single-url.mjs "$JOB_URL"

    - name: Sync Evaluation to Private Career Ops Repo
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        if [ -z "$PRIVATE_REPO_TOKEN" ]; then
          echo "No PRIVATE_REPO_TOKEN configured. Skipping private sync."
          exit 0
        fi
        git config --global user.name "Career-Ops Cloud Bot"
        git config --global user.email "bot@career-ops.local"
        git clone https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/Sudheeshsreenilayam/career-ops.git private-repo
        mkdir -p private-repo/reports private-repo/batch/tracker-additions
        cp -r reports/staged/* private-repo/reports/ 2>/dev/null || true
        cp -r batch/tracker-additions/* private-repo/batch/tracker-additions/ 2>/dev/null || true
        cd private-repo
        node merge-tracker.mjs || true
        node dedup-tracker.mjs || true
        git add -f reports/ batch/tracker-additions/ data/applications.md
        git commit -m "chore: mobile evaluated URL sync [skip ci]" || echo "Nothing new to commit."
        git push origin main
