name: Daily Cloud Scanner & Evaluator

on:
  schedule:
    # 5:00 AM CDT (Chicago) -> 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Public Engine Repo
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Dependencies
      run: |
        npm ci
        npx playwright install-deps
        npx playwright install chromium

    - name: Pre-fetch Scan History & Tracker from Private Repo
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        mkdir -p data reports/staged batch/tracker-additions
        if [ -n "$PRIVATE_REPO_TOKEN" ]; then
          echo "Fetching existing scan history and applications tracker..."
          git clone --depth 1 https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/Sudheeshsreenilayam/career-ops.git temp-repo
          cp temp-repo/data/scan-history.tsv data/scan-history.tsv 2>/dev/null || true
          cp temp-repo/data/applications.md data/applications.md 2>/dev/null || true
          cp -r temp-repo/reports reports/existing-reports 2>/dev/null || true
          rm -rf temp-repo
        fi
        if [ ! -f data/pipeline.md ]; then
          printf "# Pipeline Inbox\n\n## Pendientes\n\n## Procesadas\n" > data/pipeline.md
        fi

    - name: Run Zero-Token Portal Scan
      run: |
        echo "Running zero-token portal scanner..."
        node scan.mjs

    - name: Run AI Evaluator with Multi-Model Failover
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ANONYMIZED_PROFILE: ${{ secrets.ANONYMIZED_PROFILE }}
      run: |
        echo "Evaluating newly scanned roles..."
        node evaluate.mjs

    - name: Deduplicate and Sync to Private Career Ops Repo
      env:
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        if [ -z "$PRIVATE_REPO_TOKEN" ]; then
          echo "No PRIVATE_REPO_TOKEN configured. Skipping private sync."
          exit 0
        fi
        echo "Syncing evaluated results to private repository with deduplication..."
        git config --global user.name "Career-Ops Cloud Bot"
        git config --global user.email "bot@career-ops.local"
        git clone https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/Sudheeshsreenilayam/career-ops.git private-repo
        mkdir -p private-repo/reports private-repo/batch/tracker-additions private-repo/data
        cp -r reports/staged/* private-repo/reports/ 2>/dev/null || true
        cp -r batch/tracker-additions/* private-repo/batch/tracker-additions/ 2>/dev/null || true
        cp data/scan-history.tsv private-repo/data/scan-history.tsv 2>/dev/null || true
        cd private-repo
        node merge-tracker.mjs || true
        node dedup-tracker.mjs || true
        git add -f reports/ batch/tracker-additions/ data/applications.md data/scan-history.tsv
        git commit -m "chore: daily automated scan and evaluation sync [skip ci]" || echo "Nothing new to commit."
        git push origin main

    - name: Persist Scan History to Cloud Engine Repo
      run: |
        git config --global user.name "Career-Ops Cloud Bot"
        git config --global user.email "bot@career-ops.local"
        git add data/scan-history.tsv
        git commit -m "chore: update scan-history dedup baseline [skip ci]" || echo "No scan-history changes."
        git push origin main || echo "Push skipped."